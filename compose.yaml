services:
  mosquitto:
    image: eclipse-mosquitto:2
    # Run as the host user so the broker can read the mounted keys and password
    # file, which stay private (mode 600) on the host.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
