log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Authentication and authorisation, shared by all listeners.
# Plugins replace the older password_file/acl_file options (Mosquitto 2.1+).
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/passwd

plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

# Plain MQTT for the plain and e2e modes.
# Anonymous access is left open on purpose to demonstrate the vulnerability.
listener 1883
listener_allow_anonymous true

# MQTT over TLS for the tls mode. Login required.
listener 8883
listener_allow_anonymous false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
